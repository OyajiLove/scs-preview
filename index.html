<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dama Nocturna | Squared Circle Soul</title>
<style>
/* SCS Shared Styles - Burnt Burgundy + Gold + Frosted Glass */
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

/* Form elements don't inherit font-family by default — force inheritance from body */
button, input, select, textarea, option, optgroup {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

/* Keep long expert surfaces visibly scrollable without using a wide native bar. */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(30, 10, 18, 0.45); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }
* { scrollbar-width: thin; scrollbar-color: var(--border-light) rgba(30, 10, 18, 0.45); }

:root {
  --bg-base: #1e0a12;
  --bg-sidebar: #220c16;
  --bg-panel: #2c1420;
  --bg-card: #341828;
  --bg-active: #401e2c;
  --border: #462232;
  --border-light: #552840;
  --gold: #c4a060;
  --gold-dim: rgba(196,160,96,0.3);
  --gold-glow: rgba(196,160,96,0.15);
  --text: #e0d0c2;
  --muted: #9a7e82;
  --positive: #5b8a5b;
  --negative: #cc5555;
  --warning: #b8965b;
  --face: #5b8a5b;
  --heel: #cc5555;
  --tweener: #9b6ebd;
  --font-header: 'Barlow', sans-serif;
  --font-body: 'Rubik', sans-serif;
  --font-data: 'JetBrains Mono', monospace;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible,
a[href]:focus-visible,
[tabindex]:not([tabindex="-1"]):focus-visible {
  outline: 2px solid var(--gold) !important;
  outline-offset: 2px;
}

button:disabled,
input:disabled,
select:disabled,
textarea:disabled,
[aria-disabled="true"] {
  opacity: 0.5;
  cursor: not-allowed !important;
  filter: saturate(0.45);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

html, body {
  background: var(--bg-base);
  background-image: radial-gradient(ellipse at 25% 15%, rgba(120, 40, 65, 0.35) 0%, transparent 55%),
                    radial-gradient(ellipse at 75% 85%, rgba(100, 35, 55, 0.30) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 50%, rgba(80, 30, 50, 0.20) 0%, transparent 65%),
                    radial-gradient(ellipse at 10% 80%, rgba(60, 25, 45, 0.15) 0%, transparent 40%),
                    radial-gradient(ellipse at 90% 20%, rgba(70, 30, 50, 0.12) 0%, transparent 45%);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  height: 100vh;
}

/* ==================== LAYOUT ==================== */
.screen {
  display: grid;
  grid-template-columns: 140px minmax(0, 1fr);
  grid-template-rows: 44px 1fr;
  height: 100vh;
}

/* ==================== HEADER ==================== */
.header {
  grid-column: 1 / -1;
  background: rgba(44, 20, 32, 0.55);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.header .badge {
  width: 28px; height: 28px;
  background: var(--border-light);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--muted);
  flex-shrink: 0;
}
.header .promo-name { font-weight: 600; font-size: 14px; color: var(--text); font-family: var(--font-header); }
.header .header-sep { color: var(--border); font-size: 12px; user-select: none; }
.header .date { color: var(--muted); font-size: 12px; }
.header .prestige { color: var(--gold); font-size: 12px; font-weight: 600; font-family: var(--font-data); }
.header .funds { color: var(--gold); font-size: 12px; font-weight: 600; font-family: var(--font-data); }
.header .roster-count { color: var(--muted); font-size: 12px; }
.header .save-btn {
  margin-left: auto;
  color: var(--gold); font-size: 11px; font-weight: 700;
  cursor: pointer; letter-spacing: 0.5px;
  background: none; border: none; font-family: var(--font-header);
}
.header .save-btn:hover { color: #d4bc82; }
.scs-media-image { display: block; width: 100%; height: 100%; object-fit: cover; }
.scs-media-fallback { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.mobile-nav-toggle, .mobile-nav-overlay { display: none; }

/* ==================== SIDEBAR ==================== */
.sidebar {
  background: rgba(34, 12, 22, 0.55);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow-y: auto;
}
.nav-section { padding: 8px 0; border-bottom: 1px solid var(--border); flex: 1; }
.nav-item {
  display: block; width: 100%; padding: 6px 12px;
  font-size: 12px; color: var(--muted); cursor: pointer;
  text-align: left; border: none; background: none;
  border-left: 3px solid transparent;
  transition: all 0.15s; font-family: var(--font-body);
}
.nav-item:hover { background: rgba(52, 24, 40, 0.4); color: var(--text); }
.nav-item.active { color: var(--gold); border-left: 3px solid var(--gold); }

.sidebar-snapshot {
  padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: center;
}
.snapshot-badge {
  display: inline-block; width: 32px; height: 32px;
  background: var(--border-light); border-radius: 4px;
  line-height: 32px; font-size: 10px; color: var(--muted);
  font-weight: 700; margin-bottom: 6px;
}
.snapshot-name { font-size: 11px; color: var(--text); margin-bottom: 4px; font-weight: 500; }
.snapshot-stat { font-size: 10px; color: var(--muted); line-height: 1.6; }

.sidebar-actions {
  padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; margin-top: auto;
}
.sidebar-btn {
  width: 100%; padding: 5px 8px; font-size: 10px; font-weight: 600;
  border-radius: 4px; cursor: pointer; text-align: center;
  font-family: inherit; border: 1px solid var(--border-light);
  background: transparent; color: var(--gold); transition: all 0.15s;
}
.sidebar-btn:hover { background: var(--border); border-color: var(--gold); }
.sidebar-btn.primary { background: var(--gold); color: var(--bg-base); border-color: var(--gold); font-weight: 700; }
.sidebar-btn.primary:hover { background: #d4bc82; }

/* ==================== MAIN CONTENT ==================== */
.main { position: relative; min-width: 0; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

.main:has(> .sub-tabs) {
  padding-top: 0;
}

/* ==================== FROSTED GLASS PANELS ==================== */
.glass-panel {
  background: rgba(44, 20, 32, 0.45);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
}

/* ==================== WIDGET SYSTEM ==================== */
.widget-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
@media (min-width: 1400px) { .widget-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 900px) { .widget-grid { grid-template-columns: repeat(2, 1fr); } }

.widget {
  background: rgba(44, 20, 32, 0.45);
  backdrop-filter: blur(36px);
  -webkit-backdrop-filter: blur(36px);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  position: relative;
}
.widget-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.widget-title {
  font-size: 11px; color: var(--gold); text-transform: uppercase;
  letter-spacing: 0.8px; font-weight: 700; font-family: var(--font-header);
}
.widget-swap {
  font-size: 9px; color: var(--muted); cursor: pointer;
  background: none; border: none; padding: 2px 4px;
  transition: color 0.15s;
}
.widget-swap:hover { color: var(--gold); }

.widget-line {
  font-size: 12px; color: var(--text); padding: 3px 0;
  display: flex; justify-content: space-between; align-items: center;
}
.widget-line .label { color: var(--muted); }
.widget-line .value { color: var(--text); }
.widget-line .gold { color: var(--gold); font-family: var(--font-data); }
.widget-line .green { color: var(--positive); }
.widget-line .red { color: var(--negative); }
.widget-line .amber { color: var(--warning); }

/* ==================== ASSMIN PANEL ==================== */
.assmin-panel {
  background: rgba(44, 20, 32, 0.45);
  backdrop-filter: blur(36px);
  -webkit-backdrop-filter: blur(36px);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 6px;
  padding: 14px 16px;
  display: flex; gap: 14px; align-items: flex-start;
}
.assmin-panel[hidden] { display: none; }
.assmin-portrait {
  width: 40px; height: 40px; background: var(--border);
  border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; color: #7a5562;
}
.assmin-content { flex: 1; }
.assmin-speaker { font-size: 10px; color: var(--gold); margin-bottom: 6px; font-weight: 600; }
.assmin-text { font-size: 12px; color: var(--text); line-height: 1.55; }

/* ==================== SHARED VIEW STATES ==================== */
.scs-blocking-state-region {
  position: absolute;
  z-index: 80;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(19, 5, 11, 0.88);
  backdrop-filter: blur(3px);
}

.scs-blocking-state-region[hidden],
.scs-advisory-state-region:empty { display: none; }

.scs-advisory-state-region {
  display: grid;
  gap: 8px;
  margin: 0 0 14px;
}

.scs-view-state {
  width: min(100%, 560px);
  padding: 16px;
  border: 1px solid var(--border-light);
  border-left: 4px solid var(--gold);
  border-radius: 6px;
  background: var(--bg-panel);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
}

.scs-advisory-state-region .scs-view-state { width: 100%; box-shadow: none; }
.scs-view-state-recoverable_error,
.scs-view-state-stale_selection { border-left-color: var(--warning); }
.scs-view-state-hard_error { border-left-color: var(--negative); }
.scs-view-state-offline,
.scs-view-state-no_llm,
.scs-view-state-no_assistant,
.scs-view-state-missing_media { border-left-color: var(--muted); }

.scs-view-state-title {
  color: var(--text-bright);
  font-family: var(--font-header);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.2px;
}

.scs-view-state-message {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.scs-view-state-progress {
  width: 100%;
  height: 8px;
  margin-top: 14px;
  accent-color: var(--gold);
}

.scs-view-state-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.scs-view-state-action {
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--border-light);
  border-radius: 4px;
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
}

.scs-view-state-action:hover { border-color: var(--gold); color: var(--gold); }
.scs-view-state-inline { width: 100%; box-shadow: none; }

/* ==================== TOOLTIPS (CK3 STYLE) ==================== */
.entity-link {
  color: var(--gold); cursor: pointer;
  border-bottom: 1px dotted rgba(196,160,96,0.4);
  transition: all 0.15s;
}
.entity-link:hover { border-bottom-color: var(--gold); text-shadow: 0 0 8px rgba(196,160,96,0.2); }

.tooltip {
  position: fixed; z-index: 1000; max-width: 300px;
  background: rgba(44, 20, 32, 0.85);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--border);
  border-top: 2px solid var(--gold);
  border-radius: 6px; padding: 10px 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  pointer-events: none; display: none;
  font-size: 12px;
}
.tooltip.visible { display: block; }
.tooltip-name { font-weight: 600; color: var(--text); margin-bottom: 4px; }
.tooltip-sub { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
.tooltip-divider { height: 1px; background: #3a1e2a; margin: 6px 0; }
.tooltip-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 11px; }
.tooltip-row .label { color: var(--muted); }
.tooltip-row .value { color: var(--text); }

/* ==================== BUTTONS ==================== */
.btn { cursor: pointer; border: none; border-radius: 4px; font-size: 11px; padding: 6px 12px; font-family: var(--font-body); transition: all 0.15s; }
.btn-gold { background: var(--gold); color: var(--bg-base); font-weight: 600; }
.btn-gold:hover { background: #d4bc82; }
.btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }

/* ==================== DATA TABLE ==================== */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  text-align: left; color: var(--gold); text-transform: uppercase;
  letter-spacing: 0.5px; font-size: 10px; padding: 6px 8px;
  border-bottom: 1px solid var(--border); font-family: var(--font-header);
}
.data-table td {
  padding: 6px 8px; border-bottom: 1px solid var(--bg-card);
  font-size: 12px; color: var(--text);
}
.data-table tr:hover td { background: rgba(52, 24, 40, 0.3); }
.data-table .face { color: var(--face); }
.data-table .heel { color: var(--heel); }
.data-table .tweener { color: var(--tweener); }

/* ==================== SUB-TABS ==================== */
.sub-tabs {
  display: flex; gap: 0;
  background: rgba(44, 20, 32, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  margin-top: 14px;
  flex-shrink: 0;
}
.main > .sub-tabs { margin-top: 0; }
.sub-tab {
  padding: 8px 14px; font-size: 12px; color: var(--muted);
  cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent;
  font-family: var(--font-body); transition: all 0.15s;
}
.sub-tab:hover { color: var(--text); }
.sub-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ==================== HEAT / STATUS PILLS ==================== */
.pill {
  display: inline-block; font-size: 10px; padding: 2px 8px;
  border-radius: 10px; font-weight: 500;
}
.pill-nuclear { background: rgba(204,85,85,0.3); color: #dd6644; }
.pill-hot { background: rgba(184,150,91,0.3); color: #c4a060; }
.pill-warm { background: rgba(91,138,91,0.3); color: #7a9a5b; }
.pill-cool { background: rgba(138,110,114,0.2); color: var(--muted); }

/* ==================== SKILL BARS ==================== */
.skill-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
.skill-name { width: 90px; text-align: right; font-size: 11px; color: var(--muted); }
.skill-track { flex: 1; height: 14px; background: #06020400; border-radius: 2px; position: relative; overflow: hidden; background: rgba(6,2,4,0.6); }
.skill-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.skill-fill.tier-1 { background: #8a5b5b; }
.skill-fill.tier-2 { background: #b8965b; }
.skill-fill.tier-3 { background: #5b8a5b; }
.skill-fill.tier-4 { background: #c4a060; }
.skill-value { width: 24px; text-align: right; font-size: 11px; font-family: var(--font-data); }

/* ==================== PROGRESS BARS ==================== */
.progress-bar { height: 6px; background: rgba(6,2,4,0.6); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.progress-fill.gold { background: var(--gold); }
.progress-fill.green { background: var(--positive); }
.progress-fill.red { background: var(--negative); }

/* ==================== CONSTRAINED WINDOW SHELL ==================== */
@media (max-width: 720px) {
  html, body {
    width: 100%;
    max-width: 100%;
    overflow: hidden;
  }

  .screen {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 44px minmax(0, 1fr);
    width: 100vw;
    max-width: 100vw;
  }

  .sidebar { display: none; }

  .main {
    grid-column: 1;
    min-width: 0;
    max-width: 100vw;
    padding: 12px;
  }

  .header {
    min-width: 0;
    max-width: 100vw;
    padding: 0 10px;
    gap: 7px;
    overflow: hidden;
  }

  .header .promo-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .header .date,
  .header .save-btn { white-space: nowrap; }

  .header .header-sep,
  .header .prestige,
  .header .funds,
  .header .roster-count { display: none; }

  .header .save-btn {
    margin-left: auto;
    flex: 0 0 auto;
  }

  .mobile-nav-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-left: auto;
    padding: 0 9px;
    border: 1px solid var(--border-light);
    border-radius: 3px;
    background: var(--bg-card);
    color: var(--gold);
    font-family: var(--font-header);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  .header .save-btn + .mobile-nav-toggle { margin-left: 0; }

  .mobile-nav-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    align-items: flex-start;
    justify-content: flex-end;
    background: rgba(6, 2, 4, 0.72);
  }

  .mobile-nav-overlay:not([hidden]) { display: flex; }

  .mobile-nav-panel {
    width: min(330px, calc(100vw - 22px));
    max-height: calc(100vh - 22px);
    margin: 11px;
    overflow-y: auto;
    border: 1px solid var(--border-light);
    border-radius: 6px;
    background: var(--bg-sidebar);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
  }

  .mobile-nav-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--gold);
    font-family: var(--font-header);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .mobile-nav-close, .mobile-nav-item {
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: var(--font-body);
    text-align: left;
  }

  .mobile-nav-close { min-height: 44px; padding: 0 8px; color: var(--muted); font-size: 11px; }
  .mobile-nav-group { display: grid; padding: 11px 10px 4px; }
  .mobile-nav-group-title { padding: 0 6px 6px; color: var(--muted); font-family: var(--font-header); font-size: 9px; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; }
  .mobile-nav-item { min-height: 44px; padding: 0 7px; border-top: 1px solid rgba(113, 73, 85, 0.42); font-size: 13px; }
  .mobile-nav-item:active { background: var(--bg-active); color: var(--gold); }

  .sub-tabs,
  .main > .sub-tabs {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    padding-left: 4px;
    padding-right: 4px;
  }

  .sub-tab {
    flex: 0 0 auto;
    min-height: 44px;
    padding-left: 10px;
    padding-right: 10px;
  }

  .widget-grid { grid-template-columns: minmax(0, 1fr); }
  .glass-panel, .widget, .assmin-panel { min-width: 0; }
}

</style>
<style>
/* Shared frame (wave 2): 44 px top bar + 140 px sidebar, identical on every screen.
   Layout tokens (.screen grid, .header, .sidebar, .nav-item) stay in styles.css; this file holds the
   wave-1 finish that office and magazine each carried inline. Markup is built by frame.js. */
.header .stat { color: var(--muted); font-size: 12px; font-family: var(--font-header); text-transform: uppercase; letter-spacing: .7px; white-space: nowrap; }
.header .stat b { color: var(--text); font-family: var(--font-data); font-weight: 500; margin-left: 4px; }
.header .badge.has-logo { background-color: transparent; background-size: contain; background-repeat: no-repeat; background-position: center; width: 34px; height: 34px; }
.header .badge { background: var(--gold); color: var(--bg-base); font-weight: 700; font-size: 11px; }
.header .countdown { margin-left: auto; color: var(--gold); font-family: var(--font-header); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .7px; white-space: nowrap; }
.header .countdown b { font-family: var(--font-data); font-size: 15px; margin: 0 4px; }
.header .adv { background: var(--gold); color: var(--bg-base); font-family: var(--font-header); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; padding: 6px 12px; border-radius: 3px; border: none; cursor: pointer; white-space: nowrap; }
.header .adv:hover { background: #d4bc82; }
.sidebar { padding-top: 8px; }

</style>
<!--
WORKER PROFILE (wave 2, batch 2). Renders entirely from onStateUpdate(state); see mock/worker_profile.json.

State fields read:
  frame{...}                       top bar, drawn by ../shared/frame.js
  tab                              optional first sub-tab: overview | skills | career | relations | contract | health
  radar_mode                       optional first radar view: groups | <group key>

         body_type, trained_by, debut_year, signature,
         pop, buzz (0-20), morale (0-20, 10 neutral), fatigue (0-20),
         neighbours{prev{id,name}, next{id,name}}   the adjacent workers for the arrows; empty id = none

         groups[{key,label}]        skill groups in display order (ring, physical, mental, show, broadcast)
         skills[{group,key,label,value 0-20,role_avg 0-20}]   role_avg is the average for this worker's card position

         unread                     count of things about the worker the booker has not noticed yet

Hidden personality is never sent as numbers. The Overview shows the booker's observations instead.

Emits:
  SCS.action('open_worker',{id})              prev/next arrows, ties, comparables
  SCS.action('open_worker',{id,tab:'dna'})    the DNA tab (wave 3 character_dna_v2 answers it; the tab is not drawn here)

  SCS.action('open_program',{id})             View program

<body data-frame-active="roster">
<div class="screen">
  <div class="header"></div>
  <div class="sidebar"></div>
  <div class="main" id="main">
    <div class="sub-tabs" id="tabs"></div>
    <section class="ident" id="ident"></section>
    <div id="view"></div>
  </div>
  <div class="lightbox" id="lightbox"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="reader" id="reader" hidden></div>
</div>
<script>
/* Shared frame (wave 2). Builds the top bar and sidebar into the page's empty .header and .sidebar
   elements, marks the active sidebar item, and refreshes the top bar from state.frame.

   Page contract:  <div class="header"></div><div class="sidebar"></div> inside .screen, and
   <body data-frame-active="roster"> naming the current sidebar route. Load this script after those
   elements and before bridge.js, so bridge.js finds the nav items when it wires navigation.

   state.frame fields (a flat state with the same keys at top level is accepted as a fallback):
     promotion{name,badge}, date{label}, funds, prestige, roster_count, next_show{days,venue}
   Emits: SCS.advanceDay() from the Advance day button; SCS.navigate(route) from bridge.js.
   Sidebar routes, in order: office, roster, booking, creative, programs, phone, scouting,
   finances (Business), titles, world, calendar, settings. */
(function () {
  var NAV = [
    ['office', 'Office'], ['roster', 'Roster'], ['booking', 'Booking'], ['creative', 'Creative'],
    ['programs', 'Programs'], ['phone', 'Phone'], ['scouting', 'Scouting'], ['finances', 'Business'],
    ['titles', 'Titles'], ['world', 'World'], ['calendar', 'Calendar'], ['settings', 'Settings']
  ];
  function $(id) { return document.getElementById(id); }

  function mount() {
    var header = document.querySelector('.screen > .header');
    var sidebar = document.querySelector('.screen > .sidebar');
    if (!header || !sidebar) return;
    var active = document.body.getAttribute('data-frame-active') || '';
    header.innerHTML =
      '<div class="badge" id="hdrBadge">SC</div>' +
      '<div class="promo-name" id="hdrName"></div>' +
      '<div class="stat">Money<b id="hdrFunds"></b></div>' +
      '<div class="stat">Prestige<b id="hdrPrestige"></b></div>' +
      '<div class="stat">Roster<b id="hdrRoster"></b></div>' +
      '<div class="stat" id="hdrDate"></div>' +
      '<div class="countdown" id="hdrCountdown"></div>' +
      '<button class="adv" id="advBtn">Advance day</button>';
    sidebar.innerHTML = '<div class="nav-section">' + NAV.map(function (n) {
      return '<button class="nav-item' + (n[0] === active ? ' active' : '') + '" data-screen="' + n[0] + '">' + n[1] + '</button>';
    }).join('') + '</div>';
    $('advBtn').addEventListener('click', function () { if (typeof ipc !== 'undefined') SCS.advanceDay(); });
  }

  function update(s) {
    s = s || {};
    var f = s.frame || s;
    var p = f.promotion || {}, d = f.date || {}, ns = f.next_show || {};
    if (!$('hdrBadge')) return;
    // promotion.logo (optional) replaces the letter badge with the promotion's logo
    var bd = $('hdrBadge');
    bd.textContent = p.logo ? '' : (p.badge || '');
    bd.classList.toggle('has-logo', !!p.logo);
    bd.style.backgroundImage = p.logo ? 'url("' + p.logo + '")' : '';
    $('hdrName').textContent = p.name || '';
    $('hdrFunds').textContent = '$' + Number(f.funds || 0).toLocaleString('en-CA');
    $('hdrPrestige').textContent = f.prestige != null ? f.prestige : '';
    $('hdrRoster').textContent = f.roster_count != null ? f.roster_count : '';
    $('hdrDate').textContent = d.label || '';
    $('hdrCountdown').innerHTML = ns.days == null ? '' :
      'Next show <b>' + ns.days + '</b> ' + (ns.days === 1 ? 'day' : 'days') + (ns.venue ? ' · ' + ns.venue : '');
  }

  mount();
  window.SCSFrame = { mount: mount, update: update };
})();

</script>
<script>
// SCS Bridge: GDScript <-> JavaScript communication layer
// Handles navigation, data binding, tooltips, widget system

const SCS = {
  // Current game state (populated by GDScript via post_message)
  state: {
    promotion: {},
    date: {},
    funds: 0,
    roster: [],
    programs: [],
    titles: [],
    shows: [],
    news: [],
    assmin: { name: "Your Assistant Booker", text: "" }
  },

  // Navigation
  navigate(screen) {
    ipc.postMessage(JSON.stringify({ type: "navigate", screen: screen }));
  },

  // Send action to GDScript
  action(actionType, data = {}) {
    ipc.postMessage(JSON.stringify({ type: "action", action: actionType, data: data }));
  },

  // Request data refresh
  refresh() {
    ipc.postMessage(JSON.stringify({ type: "refresh" }));
  },

  // Save game
  save() {
    ipc.postMessage(JSON.stringify({ type: "save" }));
  },

  // Advance day
  advanceDay() {
    ipc.postMessage(JSON.stringify({ type: "advance_day" }));
  },

  // Fast forward
  fastForward(mode) {
    ipc.postMessage(JSON.stringify({ type: "fast_forward", mode: mode }));
  },

  // Update header with current state
  updateHeader() {
    const p = this.state.promotion;
    const d = this.state.date;
    document.querySelectorAll('.header .badge').forEach(el => el.textContent = p.abbreviation || 'SCS');
    document.querySelectorAll('.header .promo-name').forEach(el => el.textContent = p.name || 'Squared Circle Soul');
    document.querySelectorAll('.header .date').forEach(el => {
      const months = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
      el.textContent = `${months[d.month || 1]} ${d.day || 1}, ${d.year || 1985}`;
    });
    document.querySelectorAll('.header .prestige').forEach(el => el.textContent = `Prestige: ${p.prestige || 0}`);
    document.querySelectorAll('.header .funds').forEach(el => el.textContent = `$${(this.state.funds || 0).toLocaleString()}`);
    document.querySelectorAll('.header .roster-count').forEach(el => el.textContent = `Roster: ${(p.roster_size || 0)}`);
  },

  // Update sidebar snapshot
  updateSidebar() {
    const p = this.state.promotion;
    document.querySelectorAll('.snapshot-badge').forEach(el => el.textContent = p.abbreviation || '');
    document.querySelectorAll('.snapshot-name').forEach(el => el.textContent = p.name || '');
    document.querySelectorAll('.snapshot-stat').forEach(el => {
      el.innerHTML = `Prestige: ${p.prestige || 0}<br>Funds: $${(this.state.funds || 0).toLocaleString()}<br>${this.state.date.year || 1985}`;
    });
  },

  // Format currency
  formatMoney(amount) {
    if (amount >= 1000000) return `$${(amount / 1000000).toFixed(1)}M`;
    if (amount >= 1000) return `$${Math.floor(amount / 1000)}K`;
    return `$${amount}`;
  },

  // Natural language for stats (assmin voice)
  popFeel(pop) {
    if (pop >= 17) return "a global icon";
    if (pop >= 14) return "a household name";
    if (pop >= 11) return "over with the crowd";
    if (pop >= 8) return "building a following";
    if (pop >= 5) return "getting known";
    return "a fresh face";
  },

  buzzFeel(buzz) {
    if (buzz >= 17) return "white hot";
    if (buzz >= 14) return "red hot";
    if (buzz >= 11) return "on a roll";
    if (buzz >= 8) return "steady";
    if (buzz >= 5) return "cooling off";
    return "ice cold";
  },

  heatFeel(heat) {
    if (heat >= 16) return "white hot";
    if (heat >= 12) return "red hot";
    if (heat >= 8) return "heating up";
    if (heat >= 5) return "simmering";
    return "lukewarm";
  },

  heatPillClass(heat) {
    if (heat >= 16) return "pill-nuclear";
    if (heat >= 12) return "pill-hot";
    if (heat >= 8) return "pill-warm";
    return "pill-cool";
  },

  chemistryLabel(value) {
    const raw = Number(value);
    const chem = Number.isFinite(raw) ? raw : 10;
    if (chem >= 16) return { text: "Electric", class: "green" };
    if (chem >= 12) return { text: "Strong", class: "green" };
    if (chem >= 8) return { text: "Decent", class: "" };
    if (chem >= 5) return { text: "Flat", class: "amber" };
    return { text: "Toxic", class: "red" };
  },

  // Skill bar tier class
  skillTier(value) {
    if (value >= 16) return "tier-4";
    if (value >= 11) return "tier-3";
    if (value >= 6) return "tier-2";
    return "tier-1";
  },

  // Skill bar color for value labels
  skillColor(value) {
    if (value >= 16) return "var(--gold)";
    if (value >= 11) return "var(--positive)";
    if (value >= 6) return "var(--warning)";
    return "var(--negative)";
  },

  // Entity lookup helpers
  getWorker(id) {
    return (this.state.roster || []).find(w => w.id === id) || null;
  },
  getTitle(id) {
    return (this.state.titles || []).find(t => t.id === id) || null;
  },
  getProgram(id) {
    return (this.state.programs || this.state.feuds || []).find(f => f.id === id) || null;
  },
  getFeud(id) {
    return this.getProgram(id);
  },

  openEntity(type, id) {
    if (!id) return;
    if (type === 'worker') {
      this.action('view_worker', { worker_id: id });
    } else if (type === 'program' || type === 'feud') {
      this.action('view_program', { program_id: id });
    } else if (type === 'promotion') {
      this.action('view_promotion', { id: id });
    } else if (type === 'title') {
      this.action('view_title', {
        title_id: id,
        return_screen: document.body.dataset.titleReturn || ''
      });
    } else if (type === 'team') {
      this.action('view_team', { id: id });
    }
  },

  decorateEntityLinks(root = document) {
    root.querySelectorAll('.entity-link[data-entity-type][data-entity-id]').forEach(link => {
      const type = link.dataset.entityType;
      if (!['worker', 'program', 'feud', 'promotion', 'title', 'team'].includes(type)) return;
      if (!link.hasAttribute('tabindex')) link.tabIndex = 0;
      if (!link.hasAttribute('role')) link.setAttribute('role', 'link');
    });
  },

  // Alignment colour for name rendering
  alignmentColor(alignment) {
    const a = (alignment || '').toLowerCase();
    if (a === 'face') return 'var(--face, #7ab87a)';
    if (a === 'heel') return 'var(--heel, #e07070)';
    return 'var(--text)';
  },

  // Morale summary from roster
  moraleSummary(roster) {
    if (!roster || roster.length === 0) return '--';
    const avg = roster.reduce((s, w) => {
      const morale = Number(w.morale);
      return s + (Number.isFinite(morale) ? morale : 10);
    }, 0) / roster.length;
    if (avg >= 18) return 'Excellent';
    if (avg >= 14) return 'Good';
    if (avg >= 10) return 'Mixed';
    if (avg >= 6) return 'Low';
    return 'Crisis';
  },

  // Push tier display label
  pushLabel(tier) {
    const labels = {
      'ace': 'Ace', 'protected_star': 'Protected Star', 'upper_card': 'Upper Card',
      'gatekeeper': 'Gatekeeper', 'strong_midcard': 'Strong Midcard', 'midcard': 'Midcard',
      'lower_midcard': 'Lower Midcard', 'opener': 'Opener', 'enhancement': 'Enhancement'
    };
    return labels[(tier || '').toLowerCase()] || tier || '?';
  },

  mediaInitials(label, limit = 2) {
    return String(label || '??').trim().split(/\s+/).filter(Boolean)
      .map(part => part[0]).join('').slice(0, limit).toUpperCase() || '??';
  },

  renderMedia(element, options = {}) {
    if (!element) return;
    const label = options.label || options.alt || '';
    const fallback = options.fallback || this.mediaInitials(label, options.initialLimit || 2);
    const decorative = options.decorative === true;
    const paintFallback = () => {
      element.replaceChildren();
      if (decorative) return;
      const text = document.createElement('span');
      text.className = 'scs-media-fallback';
      text.textContent = fallback;
      element.appendChild(text);
      element.classList.add('scs-media-fallback-active');
      element.setAttribute('role', 'img');
      element.setAttribute('aria-label', options.alt || label || fallback);
    };
    const url = String(options.url || '').trim();
    if (decorative) {
      element.setAttribute('aria-hidden', 'true');
      element.removeAttribute('role');
      element.removeAttribute('aria-label');
    } else {
      element.removeAttribute('aria-hidden');
    }
    if (!url) {
      paintFallback();
      return;
    }
    const image = document.createElement('img');
    image.className = 'scs-media-image';
    image.src = url;
    image.alt = decorative ? '' : (options.alt || label || '');
    image.addEventListener('error', paintFallback, { once: true });
    element.replaceChildren(image);
    element.classList.remove('scs-media-fallback-active');
    element.removeAttribute('role');
    element.removeAttribute('aria-label');
  }
};

// Shared route-level loading, failure, and degraded-service states. Individual
// screens keep ownership of domain-specific empty states; this layer provides
// one accessible contract for the shell and for screens that opt into it.
const SCSViewState = {
  blockingKinds: new Set(['initial_loading', 'loading', 'slow', 'hard_error']),
  cards: new Map(),
  ready: false,
  initialTimer: null,
  slowTimer: null,
  currentScreen: '',

  labels: {
    initial_loading: ['Loading this screen', 'The game is preparing the latest information.'],
    loading: ['Loading', 'The game is preparing the latest information.'],
    slow: ['Still working', 'Large worlds can take a moment. You can keep waiting or return Home.'],
    empty: ['Nothing here yet', 'There is nothing to show in this view.'],
    recoverable_error: ['This view needs another try', 'Your game is safe. Refresh this view to try again.'],
    hard_error: ['This screen could not open', 'Return Home and try again.'],
    stale_selection: ['That selection is no longer available', 'The underlying game state changed. Choose again from the current list.'],
    missing_media: ['Image unavailable', 'A readable fallback is shown in its place.'],
    offline: ['Connected features are offline', 'The core save remains playable. Connected features will wait until the service returns.'],
    no_llm: ['Local writing service unavailable', 'Template dialogue and manual controls remain available.'],
    no_assistant: ['No assistant booker assigned', 'You can keep booking manually. Tailored assistant notes are unavailable.']
  },

  init() {
    this.ensureRegions();
    this.initialTimer = window.setTimeout(() => {
      if (!this.ready) this.show('initial_loading');
    }, 250);
    this.slowTimer = window.setTimeout(() => {
      if (!this.ready) {
        this.clear('initial_loading');
        this.show('slow');
      }
    }, 5000);
    window.addEventListener('offline', () => this.show('offline'));
    window.addEventListener('online', () => this.clear('offline'));
    if (navigator.onLine === false) this.show('offline');
  },

  ensureRegions() {
    if (!document.querySelector('.scs-blocking-state-region')) {
      const blocking = document.createElement('section');
      blocking.className = 'scs-blocking-state-region';
      blocking.hidden = true;
      const host = document.querySelector('.main') || document.body;
      host.prepend(blocking);
    }
    if (!document.querySelector('.scs-advisory-state-region')) {
      const advisory = document.createElement('aside');
      advisory.className = 'scs-advisory-state-region';
      advisory.setAttribute('aria-label', 'Availability notices');
      const host = document.querySelector('.content') || document.querySelector('.main') || document.body;
      host.prepend(advisory);
    }
  },

  show(kind, options = {}) {
    this.ensureRegions();
    const defaults = this.labels[kind] || this.labels.recoverable_error;
    const blocking = options.blocking ?? this.blockingKinds.has(kind);
    const region = document.querySelector(blocking
      ? '.scs-blocking-state-region'
      : '.scs-advisory-state-region');
    const existing = this.cards.get(kind);
    if (existing) existing.remove();

    const card = document.createElement('div');
    card.className = `scs-view-state scs-view-state-${kind}`;
    card.dataset.stateKind = kind;
    card.setAttribute('role', ['hard_error', 'recoverable_error', 'stale_selection'].includes(kind) ? 'alert' : 'status');
    card.setAttribute('aria-live', ['hard_error', 'recoverable_error'].includes(kind) ? 'assertive' : 'polite');
    card.setAttribute('aria-atomic', 'true');

    const copy = document.createElement('div');
    copy.className = 'scs-view-state-copy';
    const title = document.createElement('div');
    title.className = 'scs-view-state-title';
    title.textContent = options.title || defaults[0];
    const message = document.createElement('div');
    message.className = 'scs-view-state-message';
    message.textContent = options.message || defaults[1];
    copy.append(title, message);
    card.appendChild(copy);

    if (Number.isFinite(options.progress)) {
      const progress = document.createElement('progress');
      progress.className = 'scs-view-state-progress';
      progress.max = 100;
      progress.value = Math.max(0, Math.min(100, Math.round(options.progress * 100)));
      progress.setAttribute('aria-label', options.progressLabel || 'Loading progress');
      card.appendChild(progress);
    }

    const actions = options.actions || this.defaultActions(kind);
    if (actions.length) {
      const actionRow = document.createElement('div');
      actionRow.className = 'scs-view-state-actions';
      actions.forEach(action => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'scs-view-state-action';
        button.textContent = action.label;
        button.addEventListener('click', () => this.runAction(action, kind));
        actionRow.appendChild(button);
      });
      card.appendChild(actionRow);
    }

    region.appendChild(card);
    region.hidden = false;
    this.cards.set(kind, card);
    if (blocking) {
      const screen = document.querySelector('.screen');
      if (screen) screen.setAttribute('aria-busy', 'true');
    }
    return card;
  },

  defaultActions(kind) {
    if (kind === 'slow') return [{ label: 'Return Home', navigate: 'office_hub' }];
    if (kind === 'recoverable_error') return [{ label: 'Refresh view', refresh: true }];
    if (kind === 'hard_error') return [
      { label: 'Try again', refresh: true },
      { label: 'Return Home', navigate: 'office_hub' }
    ];
    if (kind === 'stale_selection') return [{
      label: 'Return to list',
      event: 'scs:clear-stale-selection',
      navigate: this.parentRoute()
    }];
    return [];
  },

  parentRoute() {
    return ({
      worker_profile: 'roster',
      program_detail: 'programs',
      promotion_profile: 'world',
      title_profile: 'titles'
    })[this.currentScreen] || 'office_hub';
  },

  runAction(action, kind) {
    if (action.refresh) {
      this.clear(kind);
      this.beginWaiting('Refreshing this view');
      SCS.refresh();
      return;
    }
    if (action.navigate) SCS.navigate(action.navigate);
    if (action.event) document.dispatchEvent(new CustomEvent(action.event, { detail: { kind } }));
    if (action.dismiss !== false && !action.refresh && !action.navigate) this.clear(kind);
  },

  beginWaiting(title = 'Loading') {
    this.ready = false;
    window.clearTimeout(this.slowTimer);
    this.clearBlocking();
    this.show('loading', { title });
    this.slowTimer = window.setTimeout(() => {
      if (!this.ready) {
        this.clear('loading');
        this.show('slow');
      }
    }, 5000);
  },

  clear(kind) {
    const card = this.cards.get(kind);
    if (!card) return;
    const region = card.parentElement;
    card.remove();
    this.cards.delete(kind);
    if (region && !region.children.length) region.hidden = true;
    if (![...this.cards.keys()].some(key => this.blockingKinds.has(key))) {
      const screen = document.querySelector('.screen');
      if (screen) screen.removeAttribute('aria-busy');
    }
  },

  clearBlocking() {
    [...this.cards.keys()].forEach(kind => {
      if (this.blockingKinds.has(kind)) this.clear(kind);
    });
  },

  markReady(state = {}) {
    window.clearTimeout(this.initialTimer);
    window.clearTimeout(this.slowTimer);
    const loading = state.loading || {};
    if (loading.error || loading.phase === 'failed') {
      this.ready = true;
      this.clearBlocking();
      this.show('hard_error', { message: loading.error || loading.detail });
    } else if (loading.active) {
      this.ready = false;
      this.clearBlocking();
      this.show('loading', {
        title: loading.phase ? `Loading ${String(loading.phase).replaceAll('_', ' ')}` : 'Loading',
        message: loading.detail || undefined,
        progress: Number(loading.percent)
      });
      this.slowTimer = window.setTimeout(() => {
        if (!this.ready) {
          this.clear('loading');
          this.show('slow', { message: loading.detail || undefined });
        }
      }, 5000);
    } else {
      this.ready = true;
      this.clearBlocking();
    }
    this.applyCapabilities(state.ui_capabilities || {}, state.ui || {});
    this.applyContextState(state);
  },

  applyCapabilities(capabilities, ui) {
    const screen = String(ui.current_screen || '');
    this.currentScreen = screen;
    const assistantSurface = !!document.querySelector('.assmin-panel, #booking-assmin-name, #assmin-name, #assmin-trail-name');
    const assistantUnavailable = !!(capabilities.assistant && capabilities.assistant.available === false);
    document.querySelectorAll('.assmin-panel').forEach(panel => {
      panel.hidden = assistantUnavailable;
    });
    if (assistantSurface && assistantUnavailable) {
      this.show('no_assistant');
    } else {
      this.clear('no_assistant');
    }
    const llmSurface = !!document.querySelector('[data-llm-assisted]') || ['phone', 'event_scene', 'media_interview'].includes(screen);
    if (llmSurface && capabilities.llm && capabilities.llm.available === false) {
      this.show('no_llm');
    } else {
      this.clear('no_llm');
    }
  },

  applyContextState(state) {
    const screen = this.currentScreen;
    const staleWorker = screen === 'worker_profile' && !String(state.selected_worker?.id || '').trim();
    if (staleWorker) {
      this.show('stale_selection', {
        title: 'That worker is no longer available',
        message: 'The roster changed after this profile was opened. Return to the current roster.'
      });
    } else {
      this.clear('stale_selection');
    }

    const emptyRoster = screen === 'roster' && Array.isArray(state.roster) && state.roster.length === 0;
    if (emptyRoster) {
      this.show('empty', {
        title: 'Your roster is empty',
        message: 'Open scouting to find workers who can join the promotion.',
        actions: [{ label: 'Open scouting', navigate: 'scouting' }]
      });
    } else {
      this.clear('empty');
    }
  },

  empty(container, options = {}) {
    if (!container) return null;
    container.replaceChildren();
    const card = document.createElement('div');
    card.className = 'scs-view-state scs-view-state-empty scs-view-state-inline';
    card.setAttribute('role', 'status');
    const title = document.createElement('div');
    title.className = 'scs-view-state-title';
    title.textContent = options.title || this.labels.empty[0];
    const message = document.createElement('div');
    message.className = 'scs-view-state-message';
    message.textContent = options.message || this.labels.empty[1];
    card.append(title, message);
    container.appendChild(card);
    return card;
  }
};

// Listen for messages from GDScript
document.addEventListener("message", (event) => {
  try {
    const data = JSON.parse(event.detail);
    if (data.type === "state_update") {
      Object.assign(SCS.state, data.state);
      SCSViewState.markReady(SCS.state);
      if (Array.isArray(SCS.state.programs)) SCS.state.feuds = SCS.state.programs;
      SCS.updateHeader();
      SCS.updateSidebar();
      // Trigger screen-specific update if defined
      if (typeof onStateUpdate === "function") {
        onStateUpdate(SCS.state);
      }
      SCS.decorateEntityLinks();
    } else if (data.type === 'view_state') {
      if (data.clear) SCSViewState.clear(data.kind);
      else SCSViewState.show(data.kind, data.options || {});
    } else if (data.type === "toast" && typeof showToast === "function") {
      showToast(data.message, data.error);
    }
  } catch (e) {
    console.error("Bridge: failed to parse message", e);
    SCSViewState.show('recoverable_error', {
      message: 'The screen received unreadable data. Refresh this view to try again.'
    });
  }
});

// Tooltip system
const Tooltip = {
  el: null,
  timeout: null,

  init() {
    this.el = document.createElement('div');
    this.el.className = 'tooltip';
    document.body.appendChild(this.el);

    document.addEventListener('mouseover', (e) => {
      const link = e.target.closest('.entity-link');
      if (link) {
        clearTimeout(this.timeout);
        this.timeout = setTimeout(() => this.show(link), 300);
      }
    });

    document.addEventListener('mouseout', (e) => {
      const link = e.target.closest('.entity-link');
      if (link) {
        clearTimeout(this.timeout);
        this.timeout = setTimeout(() => this.hide(), 100);
      }
    });

    this.el.addEventListener('mouseover', () => clearTimeout(this.timeout));
    this.el.addEventListener('mouseout', () => {
      this.timeout = setTimeout(() => this.hide(), 100);
    });
  },

  show(link) {
    const type = link.dataset.entityType;
    const id = link.dataset.entityId;
    let html = '';

    if (type === 'worker') {
      const w = SCS.getWorker(id) || {};
      html = `
        <div class="tooltip-name" style="color:${SCS.alignmentColor(w.alignment)}">${w.ring_name || id}</div>
        <div class="tooltip-sub">${w.real_name || ''} ${w.age ? '('+w.age+')' : ''}</div>
        <div class="tooltip-divider"></div>
        <div class="tooltip-row"><span class="label">Pop</span><span class="value" style="color:var(--gold)">${w.pop || '?'}</span></div>
        <div class="tooltip-row"><span class="label">Buzz</span><span class="value">${w.buzz || '?'}</span></div>
        <div class="tooltip-row"><span class="label">Push</span><span class="value">${SCS.pushLabel(w.push_tier)}</span></div>
        <div class="tooltip-row"><span class="label">Alignment</span><span class="value" style="color:${SCS.alignmentColor(w.alignment)}">${w.alignment || '?'}</span></div>
        <div class="tooltip-row"><span class="label">Style</span><span class="value">${w.style_anchor || '?'}</span></div>
        ${w.injured ? '<div class="tooltip-row"><span class="label">Status</span><span class="value" style="color:var(--negative)">Injured</span></div>' : ''}
      `;
    } else if (type === 'title') {
      const t = SCS.getTitle(id) || {};
      html = `
        <div class="tooltip-name">${t.name || id}</div>
        <div class="tooltip-sub">${t.type || 'Singles'}</div>
        <div class="tooltip-divider"></div>
        <div class="tooltip-row"><span class="label">Champion</span><span class="value" style="color:var(--gold)">${t.champion || 'Vacant'}</span></div>
        <div class="tooltip-row"><span class="label">Prestige</span><span class="value">${t.prestige || '?'}/20</span></div>
        <div class="tooltip-row"><span class="label">Reign</span><span class="value">${t.reign_weeks || '?'} weeks</span></div>
        <div class="tooltip-row"><span class="label">Defences</span><span class="value">${t.defences || 0}</span></div>
        <div class="tooltip-row"><span class="label">Buzz</span><span class="value">${t.buzz || '?'}</span></div>
      `;
    } else if (type === 'program' || type === 'feud') {
      const f = SCS.getProgram(id) || {};
      html = `
        <div class="tooltip-name">${f.worker1 || '?'} vs ${f.worker2 || '?'}</div>
        <div class="tooltip-divider"></div>
        <div class="tooltip-row"><span class="label">Heat</span><span class="value"><span class="pill ${SCS.heatPillClass(f.heat)}">${SCS.heatFeel(f.heat)}</span></span></div>
        <div class="tooltip-row"><span class="label">Peak Heat</span><span class="value">${f.peak_heat || '?'}</span></div>
        <div class="tooltip-row"><span class="label">Weeks</span><span class="value">${f.weeks || '?'}</span></div>
        <div class="tooltip-row"><span class="label">Status</span><span class="value">${f.status || '?'}</span></div>
        <div class="tooltip-row"><span class="label">Matches</span><span class="value">${f.matches_count || 0}</span></div>
      `;
    }

    this.el.innerHTML = html;
    this.el.classList.add('visible');

    const rect = link.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 8;
    if (left + 300 > window.innerWidth) left = window.innerWidth - 310;
    if (top + 200 > window.innerHeight) top = rect.top - 208;
    this.el.style.left = left + 'px';
    this.el.style.top = top + 'px';
  },

  hide() {
    this.el.classList.remove('visible');
  }
};

document.addEventListener('DOMContentLoaded', () => {

document.addEventListener('click', event => {
  const unavailable = event.target.closest('button[aria-disabled="true"], a[aria-disabled="true"], [role="button"][aria-disabled="true"]');
  if (unavailable) {
    event.preventDefault();
    event.stopImmediatePropagation();
  }
}, true);

document.addEventListener('keydown', event => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  const unavailable = event.target.closest('button[aria-disabled="true"], a[aria-disabled="true"], [role="button"][aria-disabled="true"]');
  if (!unavailable) return;
  event.preventDefault();
  event.stopImmediatePropagation();
}, true);

document.addEventListener('click', event => {

  if (!['worker', 'program', 'feud', 'promotion', 'title', 'team'].includes(type)) return;

// Wire sidebar navigation
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const screen = item.dataset.screen;
      if (screen) SCS.navigate(screen);
    });
  });

  document.querySelectorAll('.save-btn').forEach(btn => {
    btn.addEventListener('click', () => SCS.save());
  });

  document.querySelectorAll('.sidebar-btn.primary').forEach(btn => {
    btn.addEventListener('click', () => SCS.navigate('booking'));
  });

  // Add "Main Menu" button to sidebar if not already present
  document.querySelectorAll('.sidebar-actions').forEach(container => {
    if (!container.querySelector('.sidebar-btn-menu')) {
      const btn = document.createElement('button');
      btn.className = 'sidebar-btn sidebar-btn-menu';
      btn.textContent = 'Main Menu';
      btn.style.marginTop = '4px';
      btn.addEventListener('click', () => {
        if (confirm('Return to main menu? Unsaved progress will be lost.')) {
          SCS.navigate('main_menu');
        }
      });
      container.appendChild(btn);
    }
  });

  const header = document.querySelector('.header');
  const sidebar = document.querySelector('.sidebar');
  if (!header || !sidebar || document.querySelector('.mobile-nav-toggle')) return;
  const routeLabels = new Map([
    ['office_hub', ['Operate', 'Home']], ['booking', ['Operate', 'Book show']], ['calendar', ['Operate', 'Calendar']],
    ['roster', ['People', 'Roster']], ['scouting', ['People', 'Scout']], ['titles', ['People', 'Titles']],
    ['creative', ['Stories', 'Creative']], ['programs', ['Stories', 'Programmes']], ['phone', ['Stories', 'Phone']],
    ['finances', ['Business', 'Business']], ['world', ['World', 'World']], ['settings', ['Office', 'Settings']]
  ]);
  const groups = new Map();
  sidebar.querySelectorAll('.nav-item[data-screen]').forEach(item => {
    const screen = item.dataset.screen;
    const route = routeLabels.get(screen) || ['More', item.textContent.trim()];
    if (!groups.has(route[0])) groups.set(route[0], []);
    groups.get(route[0]).push({ screen, label: route[1] });
  });
  if (!groups.size) return;

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'mobile-nav-toggle';
  toggle.textContent = 'Menu';
  toggle.setAttribute('aria-label', 'Open game navigation');
  toggle.setAttribute('aria-haspopup', 'dialog');
  toggle.setAttribute('aria-expanded', 'false');
  toggle.setAttribute('aria-controls', 'mobile-nav-panel');
  header.appendChild(toggle);

  const overlay = document.createElement('div');
  overlay.className = 'mobile-nav-overlay';
  overlay.hidden = true;
  overlay.innerHTML = '<section class="mobile-nav-panel" id="mobile-nav-panel" role="dialog" aria-modal="true" aria-labelledby="mobile-nav-title"><div class="mobile-nav-heading"><span id="mobile-nav-title">Player jobs</span><button type="button" class="mobile-nav-close" aria-label="Close game navigation">Close</button></div></section>';
  const panel = overlay.querySelector('.mobile-nav-panel');
  const screen = document.querySelector('.screen');
  let restoreFocus = toggle;
  groups.forEach((entries, group) => {
    const section = document.createElement('div');
    section.className = 'mobile-nav-group';
    const title = document.createElement('div');
    title.className = 'mobile-nav-group-title';
    title.textContent = group;
    section.appendChild(title);
    entries.forEach(entry => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'mobile-nav-item';
      button.textContent = entry.label;
      button.addEventListener('click', () => {
        setOpen(false, false);
        SCS.navigate(entry.screen);
      });
      section.appendChild(button);
    });
    panel.appendChild(section);
  });
  document.body.appendChild(overlay);
  const focusableInPanel = () => [...panel.querySelectorAll(
    'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )].filter(element => element.offsetParent !== null);
  const setOpen = (open, restore = true) => {
    if (open) {
      restoreFocus = document.activeElement instanceof HTMLElement ? document.activeElement : toggle;
      overlay.hidden = false;
      toggle.setAttribute('aria-expanded', 'true');
      if (screen) screen.inert = true;
      requestAnimationFrame(() => {
        const first = focusableInPanel()[0];
        if (first) first.focus();
      });
      return;
    }
    overlay.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
    if (screen) screen.inert = false;
    if (restore && restoreFocus && restoreFocus.isConnected) restoreFocus.focus();
  };
  toggle.addEventListener('click', () => {
    setOpen(overlay.hidden);
  });
  overlay.querySelector('.mobile-nav-close').addEventListener('click', () => setOpen(false));
  overlay.addEventListener('click', event => { if (event.target === overlay) setOpen(false); });
  document.addEventListener('keydown', event => {
    if (overlay.hidden) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      setOpen(false);
      return;
    }
    if (event.key !== 'Tab') return;
    const focusable = focusableInPanel();
    if (!focusable.length) {
      event.preventDefault();
      return;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });
});

  /* ---------- popularity: sparse, place by place; a place with no number reads the level above ---------- */

    // Home promotion = the one the worker is most tied to, even while working elsewhere; falls back to the viewing office.
    var home = w.home_promotion || (st.data && st.data.frame && st.data.frame.promotion) || {}, employer = home.name || '';
    var deal = !c ? '<span class="fa">Free agent</span>' : '<b>' + esc(employer) + '</b>' + (c.type === 'handshake' ? ', handshake deal' : ', through ' + esc(c.ends));
    var status = row(['Push: <b>' + esc(w.push) + '</b>', '<span class="pop">Pop: ' + w.pop + '</span>', esc(w.role), 'Finish: <b>' + esc(w.signature) + '</b>', deal]);
    var pushes = PUSHES.map(function (p) { return '<button data-push="' + p + '" class="' + (p === w.push ? 'cur' : '') + '">' + p + (p === w.push ? ' (now)' : '') + '</button>'; }).join('');
    $('ident').innerHTML =
      '<div class="head-wrap">' + (home.logo ? '<img class="promo-mark" alt="" src="' + esc(home.logo) + '">' : '') + headshot(w) + '</div>' +
      '<div class="who-block"><div class="nameline banner-name"><h1>' + esc(w.name) + '</h1><span class="apill ' + esc(w.alignment) + '">' + esc(w.alignment) + '</span></div>' +
      '<div class="gim">' + esc(g.name) + '<small>' + esc(g.note) + '</small></div>' +
      '<div class="basics">' + basics + '</div><div class="status">' + status + '</div>' +
      '<div class="actions"><button class="btn btn-gold" data-talk="1">Talk</button>' +
      '<span style="position:relative"><button class="btn btn-outline" data-pushbtn="1">Change push</button><div class="push-pop' + (st.pushOpen ? ' open' : '') + '">' + pushes + '</div></span>' +
      '<button class="btn btn-outline" data-compare="1">Compare</button><button class="btn btn-outline" data-book="1">Book in match</button></div></div>' +
      '<div class="nav-arrows"><div class="arrows"><button data-open="' + esc(prev.id) + '"' + (prev.id ? '' : ' disabled') + '>◄ ' + esc(prev.name || '') + '</button>' +
      '<button data-open="' + esc(next.id) + '"' + (next.id ? '' : ' disabled') + '>' + esc(next.name || '') + ' ►</button></div>' +
      '<div class="glance"><div><div class="k">Pop</div><div class="v">' + w.pop + '</div></div><div><div class="k">Buzz</div><div class="v">' + w.buzz + '</div></div>' +
      '</div></div>';
  }
  function render() {
    $('tabs').innerHTML = TABS.map(function (t) { return '<button class="sub-tab' + (t[0] === st.tab ? ' active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('');
    renderIdent();
    var v = { overview: overview, skills: skillsTab, popularity: popularityTab, career: careerTab, relations: relationsTab, contract: contractTab, health: healthTab }[st.tab] || overview;
    $('view').innerHTML = v();
  }

  function zoomSrc(t) {
    if (t.closest('.body-pn img')) return t.closest('.body-pn img').src;
    var h = t.closest('#ident .portrait.head'); if (!h || !h.style.backgroundImage) return '';
    return h.style.backgroundImage.replace(/^url\(["']?|["']?\)$/g, '');
  }
  function openReader() {
    var w = W(), paras = String(w.bio || '').split(/\n\s*\n/).map(function (x) { return '<p>' + esc(x.trim()) + '</p>'; }).join('');
    var r = $('reader');
    r.innerHTML = '<div class="sheet" role="dialog" aria-label="Background"><header><h2>' + esc(w.name) + '</h2><span>Background</span><button class="btn btn-outline" data-close-reader="1">Close</button></header><div class="body">' + paras + '</div></div>';
    r.hidden = false;
  }
  function closeReader() { $('reader').hidden = true; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeReader(); $('lightbox').classList.remove('open'); } });
  // Skill tooltips: one second of hover, then the description; moving off hides it.
  var tipTimer = null;
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]'), tip = $('tip');
    clearTimeout(tipTimer);
    if (!el || !el.getAttribute('data-tip')) { tip.hidden = true; return; }
    tipTimer = setTimeout(function () {
      var r = el.getBoundingClientRect();
      tip.innerHTML = '<b>' + esc(el.getAttribute('data-tip-title') || el.textContent.trim()) + '</b>' + esc(el.getAttribute('data-tip'));
      tip.hidden = false;
      var x = Math.min(r.left, window.innerWidth - tip.offsetWidth - 12), y = r.bottom + 8;
      if (y + tip.offsetHeight > window.innerHeight - 8) y = r.top - tip.offsetHeight - 8;
      tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px';
    }, 1000);
  });
  document.addEventListener('click', function (e) {
    var rd = $('reader');
    if (!rd.hidden) { if (e.target === rd || e.target.closest('[data-close-reader]')) closeReader(); return; }
    var lb = $('lightbox');
    if (lb.classList.contains('open')) { lb.classList.remove('open'); return; }
    var zs = zoomSrc(e.target);
    if (zs) { lb.innerHTML = '<img alt="" src="' + esc(zs) + '">'; lb.classList.add('open'); return; }

    var t = e.target.closest('[data-region],[data-area],[data-bio],[data-tab],[data-radar],[data-open],[data-talk],[data-pushbtn],[data-push],[data-compare],[data-book],[data-prog],[data-reneg],[data-stable],[data-goto]');
    var id = W().id;
    if (!t) { if (st.pushOpen) { st.pushOpen = false; render(); } return; }
    if (t.hasAttribute('data-bio')) { openReader(); return; }
    if (t.hasAttribute('data-region')) { var ar = t.getAttribute('data-region'); st.area = st.area === ar ? '' : ar; render(); return; }
    if (t.hasAttribute('data-area')) { st.area = t.getAttribute('data-area'); render(); return; }
    if (t.hasAttribute('data-tab')) { if (t.getAttribute('data-tab') === 'dna') { act('open_worker', { id: id, tab: 'dna' }); return; } st.tab = t.getAttribute('data-tab'); st.pushOpen = false; render(); }
    else if (t.hasAttribute('data-goto')) { st.tab = t.getAttribute('data-goto'); render(); }
    else if (t.hasAttribute('data-radar')) { st.radar = t.getAttribute('data-radar'); render(); }
    else if (t.hasAttribute('data-pushbtn')) { st.pushOpen = !st.pushOpen; render(); }
    else if (t.hasAttribute('data-push')) { st.pushOpen = false; act('change_push', { id: id, push: t.getAttribute('data-push') }); render(); }
    else if (t.hasAttribute('data-open')) { if (t.getAttribute('data-open')) act('open_worker', { id: t.getAttribute('data-open') }); }
    else if (t.hasAttribute('data-talk')) act('talk_to_worker', { id: id });
    else if (t.hasAttribute('data-compare')) act('compare_worker', { id: id });
    else if (t.hasAttribute('data-book')) act('book_worker', { id: id });
    else if (t.hasAttribute('data-prog')) act('open_program', { id: t.getAttribute('data-prog') });
    else if (t.hasAttribute('data-reneg')) act('renegotiate', { id: id });
    else if (t.hasAttribute('data-stable')) act('open_stable', { id: t.getAttribute('data-stable') });
  });

  window.onStateUpdate = function (s) {
    s = s || {};
    if (typeof SCSViewState !== 'undefined') SCSViewState.markReady(s);
    st.data = s;
    if (s.tab && !st.tabSet) { st.tab = s.tab; st.tabSet = true; }
    if (s.radar_mode && !st.radarSet) { st.radar = s.radar_mode; st.radarSet = true; }
    SCSFrame.update(s);
    render();
  };
})();
</script>

, "text": "Bruised ribs when La Tigresa Dorada came up short on a senton.", "out": "Missed one show."}, {"date": "Mar 1983", "region": "ankles", "text": "Sprained her left ankle on a bad landing at Arena Naucalpan.", "out": "Worked the next two shows taped up."}, {"date": "Sep 1981", "region": "arms", "text": "Dislocated two fingers on her right hand blocking a dropkick.", "out": "Strapped them and kept working."}, {"date": "Feb 1980", "region": "head", "text": "Concussion from a ring-post bump at an indie show in Puebla.", "out": "Out three weeks."}], "wear": {"ankles": 2, "knees": 1, "shoulders": 1}}, "bio": "Margarita Vásquez started wrestling at twenty-two, which is late, especially for a woman in a profession that barely wanted women at all. She had been a secretary at a legal office in Mexico City, a job she hated with the quiet fury of a person who knows she is capable of more. She started training at a gym in the Zona Rosa that a retired luchador ran after hours, one of the few places in Mexico City that accepted female students.\n\nFor five years, Margarita worked the independent circuit as La Dama, a heel who relied on intelligence and technique in a world of brawlers. She was paid almost nothing. She was routinely disrespected. She kept going because stubbornness is its own fuel. When RLL began building a women's division in 1984, Margarita was the first heel Venegas recruited. \"I need someone who can wrestle,\" he told Lozano. \"Flying is secondary. Wrestling comes first.\" Margarita can wrestle.\n\nAt 27, Dama Nocturna is RLL's technical anchor on the rudo side of the women's division. Her mat work gives pairings with La Estrella Roja and La Tigresa Dorada a grounded contrast to their aerial pace. Margarita treats that role as earned and continues pressing for the championship.", "ratings": [11, 12, 13, 12, 14, 13, 12, 14, 15, 13, 14, 14], "matches": [{"date": "11 Jan 1985", "opp": "La Estrella Roja", "result": "Loss", "rating": 14, "venue": "Arena Col
